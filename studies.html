  const name=filename.replace(/\.[^.]+$/,'').replace(/[^\p{L}\p{N}_-]/gu,'-')||'object';
  const blob=await new Promise(resolve=>output.toBlob(resolve,'image/png'));if(!blob){message('匯出失敗，請重試',true);return;}
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${name}-${maskOnly?'mask':'cutout'}.png`;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),10000);message(`已匯出 ${output.width}×${output.height} ${maskOnly?'黑白遮罩':'透明 PNG'}`);
 }
 get('export').addEventListener('click',()=>download(false));get('mask').addEventListener('click',()=>download(true));
 function clear(){invalidate();input=null;initial=null;history=[];controls();for(const c of lab.querySelectorAll('.lab-grid canvas')){c.width=1;c.height=1;}for(let i=0;i<3;i++)get('info-'+i).textContent='';}
 async function load(url,name){
  const id=++request;clear();message('載入中…');const img=new Image();
  try{
   img.src=url;await img.decode();if(id!==request)return;
   if(img.naturalWidth<200||img.naturalHeight<200)throw Error('解像度太低（每邊至少 200px）');
   if(img.naturalWidth*img.naturalHeight>40e6)throw Error('像素太多（上限 4000 萬）');
   // ponytail: bounded synchronous flood-fill at 1200px; use a worker if full-resolution editing becomes necessary.
   const scale=Math.min(1,1200/Math.max(img.naturalWidth,img.naturalHeight));
   const work=document.createElement('canvas');work.width=Math.max(1,Math.round(img.naturalWidth*scale));work.height=Math.max(1,Math.round(img.naturalHeight*scale));
   work.getContext('2d').drawImage(img,0,0,work.width,work.height);
   const decoded=new Image();decoded.src=work.toDataURL();await decoded.decode();if(id!==request)return;
   settings={tolerance:32,trimShadow:false,clearEnclosed:false};syncSettings();
   const rgba=work.getContext('2d').getImageData(0,0,work.width,work.height).data;let hasAlpha=false,kept=0;
   for(let i=3;i<rgba.length;i+=4){if(rgba[i]<255)hasAlpha=true;if(rgba[i])kept++;}
   // Imported cutouts already carry a mask: preserve it until the user explicitly reapplies segmentation.
   const masks=[segment(decoded),hasAlpha?{canvas:work,kept:kept/(work.width*work.height)}:segment(decoded,false,settings)];
   [decoded,...masks.map(m=>m?.canvas)].forEach((image,i)=>{const c=get('view-'+i);c.width=decoded.naturalWidth;c.height=decoded.naturalHeight;if(image)c.getContext('2d').drawImage(image,0,0);
    get('info-'+i).textContent=i?(masks[i-1]?`保留像素 ${(masks[i-1].kept*100).toFixed(1)}%（非準確率）`:'未找到前景'):`${img.naturalWidth} × ${img.naturalHeight}`;});
   input=decoded;filename=name;initial=pixels();info();controls();xInput.max=input.naturalWidth-1;yInput.max=input.naturalHeight-1;xInput.value=yInput.value=0;
   message(`${name} · 比較完成${hasAlpha?' · 已保留來源透明遮罩':''}${scale<1?' · 分析及匯出縮至最長邊 1200px':''}`);
  }catch(e){if(id===request){clear();message(e.name==='EncodingError'?'圖片解碼失敗，請揀另一張相片':e.message||'圖片載入失敗',true);}}
  finally{if(url.startsWith('blob:'))URL.revokeObjectURL(url);}
 }
 function useFile(file){
  if(!file)return;
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size>20*1024*1024){++request;clear();message('請選擇 20MB 以內嘅 JPEG / PNG / WebP',true);return;}
  sample.value='';load(URL.createObjectURL(file),file.name);
 }
 sample.addEventListener('change',()=>load(SRC[sample.value]||'assets/segmentation/'+sample.value,sample.value));
 get('recipe').addEventListener('change',invalidate);
 get('evolve').addEventListener('click',async()=>{
  if(!input)return;const version=revision,name=filename,img=new Image();img.src=editable.toDataURL();
  try{await img.decode();if(version!==revision)return;
   const geometry=maskGeometry(editable);
   photo=img;recipe=get('recipe').value;setCopy(recipe);
   if(!geometry||!build(geometry)){fail(UNSUPPORTED);message('此遮罩未符合直立樽形比例；請繼續修圖或匯出，毋須套用樽配方',true);preview.hidden=true;return;}
   preview.hidden=false;show();message(`${name} · 已用目前遮罩試演化（手動選配方，非自動辨識）`);
   preview.scrollIntoView({behavior:'instant',block:'start'});
  }catch(e){if(version===revision){preview.hidden=true;message('演化預覽失敗，遮罩仍然保留，可繼續編輯',true);}}
 });
 get('bg').addEventListener('change',e=>{lab.style.setProperty('--mask-bg',e.target.value==='checker'?'#777':e.target.value);lab.classList.toggle('checker',e.target.value==='checker');});

 let dragDepth=0;
 addEventListener('dragenter',e=>{e.preventDefault();if(!dragDepth++)document.body.classList.add('drag');});
 addEventListener('dragover',e=>e.preventDefault());
 addEventListener('dragleave',()=>{dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)document.body.classList.remove('drag');});
 addEventListener('drop',e=>{e.preventDefault();dragDepth=0;document.body.classList.remove('drag');useFile(e.dataTransfer.files[0]);});
 load('assets/segmentation/'+sample.value,sample.value);if(Q.has('test'))labTest();
}
async function labTest(){
 const c=document.createElement('canvas');c.width=c.height=200;const g=c.getContext('2d');
 g.fillStyle='white';g.fillRect(0,0,200,200);g.fillStyle='red';g.fillRect(40,30,20,140);g.fillRect(140,30,20,140);g.fillRect(40,150,120,20);
 const img=new Image();img.src=c.toDataURL();await img.decode();
 const old=segment(img),filled=segment(img,true),open=segment(img,false);
 const alpha=(s,x,y)=>s.canvas.getContext('2d').getImageData(x,y,1,1).data[3];
 const rows=[['default retains existing fill',old.kept===filled.kept&&alpha(old,100,80)===255],['open concavity remains transparent without fill',alpha(open,100,80)===0],['object remains solid',alpha(open,50,80)===255&&alpha(open,100,160)===255],['outer background is transparent',alpha(open,10,10)===0],['bounds unchanged by fill toggle',old.top===open.top&&old.base===open.base&&old.width===open.width]];
 g.fillStyle='white';g.fillRect(0,0,200,200);g.strokeStyle='red';g.lineWidth=10;g.strokeRect(40,40,120,120);
 const pixels=g.getImageData(0,0,200,200),n=eraseRegion(pixels,100,100);
 rows.push(['erase enclosed region without crossing coloured wall',n>0&&pixels.data[(100*200+100)*4+3]===0&&pixels.data[(40*200+40)*4+3]===255&&pixels.data[3]===255],['transparent seed makes no change',eraseRegion(pixels,100,100)===0],['out-of-bounds seed makes no change',eraseRegion(pixels,-1,100)===0]);
 const ring=new Image();ring.src=c.toDataURL();await ring.decode();
 const conservative=segment(ring,false,{trimShadow:false}),keyed=segment(ring,false,{trimShadow:false,clearEnclosed:true});
 rows.push(['enclosed removal is opt-in',alpha(conservative,100,100)===255&&alpha(keyed,100,100)===0&&alpha(keyed,40,100)===255]);
 g.clearRect(0,0,200,200);g.fillStyle='white';g.fillRect(40,40,120,120);g.clearRect(80,80,40,40);
 const transparent=new Image();transparent.src=c.toDataURL();await transparent.decode();
 const preserved=segment(transparent);
 rows.push(['input alpha and enclosed transparent holes survive',!!preserved&&alpha(preserved,100,100)===0&&alpha(preserved,50,50)===255&&Math.abs(preserved.kept-.32)<.0001]);
 g.fillStyle='white';g.fillRect(0,0,200,200);g.fillStyle='red';g.fillRect(80,20,40,150);g.fillRect(40,145,120,30);
 const foot=new Image();foot.src=c.toDataURL();await foot.decode();
 rows.push(['generic mode preserves a wide foot instead of trimming it as shadow',alpha(segment(foot,false,{trimShadow:false}),50,160)===255&&alpha(segment(foot,false),50,160)===0]);
 const thin=document.createElement('canvas');thin.width=1;thin.height=20;const tg=thin.getContext('2d');tg.fillStyle='white';tg.fillRect(0,0,1,20);tg.fillStyle='red';tg.fillRect(0,8,1,4);
 const narrow=new Image();narrow.src=thin.toDataURL();await narrow.decode();
 rows.push(['one-pixel-wide analysis does not invent a foreground',segment(narrow,false,{trimShadow:false})===null]);
 const out=document.getElementById('lab-checks');out.hidden=false;out.textContent=rows.map(([n,ok])=>`${ok?'PASS':'FAIL'} ${n}`).join('\n');
}
