'use strict';
const SRC={bottle:'assets/bottle-source.webp','bottle-b':'assets/bottle-b-source.jpeg',cup:'assets/segmentation/water.jpg',banana:'assets/segmentation/banana.jpeg',suica:'assets/suica-source.jpg'};
const Q=new URLSearchParams(location.search),kind=!Q.has('lab')&&SRC[Q.get('object')]?Q.get('object'):'bottle',family=kind==='suica'?'suica':'bottle';
const COPY={generic:{number:'000',title:'専用レシピが<br>なくても、次の世代へ。',intro:'このモノ専用のレシピはまだない。だから測れた輪郭だけで推し進める。両端は元のまま残り、中間の外殻は退場し、輪郭に沿って伸びる耐力フレームと細くなった中核に置き換わる。',specs:['輪郭から測った骨格','両端は元のまま','露出した細い中核'],kept:'百年後も、やっていることは同じ。'},cup:{number:'006',title:'ひと口の<br>温度。',intro:'コップの壁は退場。口をつける縁と台座だけが残り、中間は吊り下げの内胆と三本の調温アームになる。飲みものはあなたの手の中にある間だけ温度を保つ。',specs:['吊り下げ式の内胆','三本アームの調温フィン','縁と台座を継承'],kept:'百年後も、ちょうどいい温度で飲みたい。'},flask:{number:'005',title:'水は、<br>空気から。',intro:'保温層は退場。真空層が凝縮フィンとして露出し、ボトル自身が空気から水を集める。あなたは持ち歩くだけ。',specs:['露出した凝縮フィン','底部の吸気と集水','鋼のキャップと輪郭を継承'],kept:'百年後も、いつでもひと口の水がほしい。'},bottle:{number:'003',title:'ひと口のお茶、<br>ひとつの循環。',intro:'使い捨ての胴は退場。飲み口とお茶を残し、培養・ろ過・補充がひとつの容器になる。',specs:['循環培養チャンバー','連結したろ過ポッド','飲み口とお茶を継承'],kept:'百年後も、あのひと口のお茶のために。'},suica:{number:'004',title:'改札を、<br>身につけて。',intro:'カードは手首の通行コアへ。翡翠色のバンドが手首を抱き、見慣れた識別面が次の扉まで一緒に行く。',specs:['開口型のリストバンド','非接触の読み取り端','元のカードの識別面を継承'],kept:'百年後も、まっすぐ家に帰りたい。'}};
function setCopy(type){const copy=COPY[type];
for(const id of ['number','intro','kept'])document.getElementById(id).textContent=copy[id];
document.getElementById('title').innerHTML=copy.title;
document.getElementById('specs').innerHTML=copy.specs.map((s,i)=>`<div><span>0${i+1}</span>${s}</div>`).join('');
}
setCopy(kind==='bottle-b'?'flask':kind==='cup'?'cup':kind==='banana'?'generic':family==='bottle'?'bottle':'suica');
document.getElementById('nav-'+kind).style.color='#9ef4de';document.getElementById('nav-'+kind).setAttribute('aria-current','page');
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d'),slider=document.getElementById('evolution'),replay=document.getElementById('replay'),phase=document.getElementById('phase');
let photo=new Image();const source=document.createElement('canvas'),future=document.createElement('canvas');
source.width=future.width=1456;source.height=future.height=970;
const scratch=document.createElement('canvas');scratch.width=1456;scratch.height=970;
// Keep repeated mask readback and resampling on one raster backend.
source.getContext('2d',{willReadFrequently:true});
// ponytail: source crops, geometry and depth are calibrated for these two photos only.
// This tests a creative grammar; add an evolution-spec renderer only after more categories validate it.
const P=s=>new Path2D(s);
function shape(c,d,fill,stroke,width=1){const p=typeof d==='string'?P(d):d;if(fill){c.fillStyle=fill;c.fill(p);}if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.stroke(p);}}
function line(c,d,color,width=1,glow=0){c.save();c.shadowBlur=glow;c.shadowColor=color;shape(c,d,null,color,width);c.restore();}
function oval(c,x,y,rx,ry,fill,stroke,width=1){const p=new Path2D();p.ellipse(x,y,rx,ry,0,0,Math.PI*2);shape(c,p,fill,stroke,width);}
function grad(c,x0,y0,x1,y1,stops){const g=c.createLinearGradient(x0,y0,x1,y1);stops.forEach(([p,col])=>g.addColorStop(p,col));return g;}
function tube(c,d,width=8){line(c,d,'#172b2d',width+3);line(c,d,'#97b6a6',width);line(c,d,'#d7ede0',1.1);}
const rr=(x,y,w,h,r)=>{const p=new Path2D();p.roundRect(x,y,w,h,r);return p;};
// --- Material ---------------------------------------------------------------------------------
// A part is shaded across ITS OWN extent. The bottle's two pods (x 235-279 and 459-510) both sat
// past the ends of one canvas-wide 280->450 ramp, so both filled with a single clamped colour.
// Flat fills on curved parts — not the geometry — are what made the assembly read as clip art.
// Lightness track of a side-lit cylinder: dark rim, narrow specular, body, bounce off the far
// wall, dark rim. Stored as fractions so one track serves every material.
const CONVEX=[[0,.14],[.08,.30],[.26,.94],[.45,.60],[.73,.27],[.90,.44],[1,.12]];
// A recess is that same wall seen from inside: the light crosses to the far side and the near lip
// shades the front of it, so the track runs backwards and darker.
const CONCAVE=[[0,.09],[.13,.19],[.5,.33],[.80,.64],[.94,.38],[1,.11]];
// Where the specular actually lands, as alpha. A highlight of constant width running the whole
// length of a part is the strongest "drawn in a vector editor" tell there is.
const SPEC=[[0,0],[.15,0],[.26,.85],[.38,0],[.68,0],[.82,.3],[.92,0],[1,0]];
const gstops=(c,a0,a1,vert,stops)=>grad(c,vert?0:a0,vert?a0:0,vert?0:a1,vert?a1:0,stops);
const axisL=(c,a0,a1,vert,track,h,s,mul=1)=>gstops(c,a0,a1,vert,
 track.map(([p,l])=>[p,`hsl(${h} ${s}% ${Math.min(97,l*100*mul).toFixed(1)}%)`]));
const axisA=(c,a0,a1,vert,track,h,s,l)=>gstops(c,a0,a1,vert,
 track.map(([p,a])=>[p,`hsl(${h} ${s}% ${l}% / ${a})`]));
const metal=(c,a0,a1,h,s,vert=false,mul=1)=>axisL(c,a0,a1,vert,CONVEX,h,s,mul);
const recess=(c,a0,a1,h,s,vert=false,mul=1)=>axisL(c,a0,a1,vert,CONCAVE,h,s,mul);
// Soft dark pool where one part sits on another. Every junction here used to be a butt joint;
// contact shading is the cue that reads "seated into" instead of "laid on top of".
function ao(c,x,y,rx,ry,a=.5){c.save();c.translate(x,y);c.scale(1,ry/rx);
 const g=c.createRadialGradient(0,0,0,0,0,rx);
 g.addColorStop(0,`rgb(5 14 12 / ${a})`);g.addColorStop(.5,`rgb(5 14 12 / ${a*.42})`);g.addColorStop(1,'rgb(5 14 12 / 0)');
 c.fillStyle=g;c.beginPath();c.arc(0,0,rx,0,7);c.fill();c.restore();}
// A machined boss around a pipe entry: contact pool, collar, lip highlight. Two ellipses and a
// band, but it is what turns a pipe pushed through a wall into a pipe bolted onto one.
function boss(c,x,y,w,h,hue,sat){
 ao(c,x,y+h*.3,w*.85,h*.75,.5);
 shape(c,rr(x-w/2,y-h/2,w,h,h*.42),metal(c,x-w/2,x+w/2,hue,sat),`hsl(${hue} ${sat}% 80% / .5)`,.8);
 shape(c,`M${x-w*.32} ${y-h*.15} L${x+w*.32} ${y-h*.15}`,null,axisA(c,x-w/2,x+w/2,false,SPEC,hue,sat,96),1);}
// A pipe: dark casing, body, rounded core, then a specular that fades ALONG the run.
// A curved pipe cannot take a cylindrical gradient — a linear ramp sized to its 20px diameter
// clamps to the end stop as soon as the path bends away, which painted the upper elbows solid
// black. Cross-section shading here has to come from stacked strokes, and only the highlight
// may be positional.
function pipe(c,d,w,hue,sat,bx0,by0,bx1,by1){
 line(c,d,`hsl(${hue} ${sat+8}% 8%)`,w+3.2);
 line(c,d,`hsl(${hue} ${sat}% 42%)`,w);
 line(c,d,`hsl(${hue} ${sat-3}% 62%)`,w*.5);
 shape(c,d,null,grad(c,bx0,by0,bx1,by1,
  [[0,`hsl(${hue} ${sat}% 96% / 0)`],[.2,`hsl(${hue} ${sat}% 96% / .8)`],[.5,`hsl(${hue} ${sat}% 96% / .2)`],
   [.78,`hsl(${hue} ${sat}% 96% / .55)`],[1,`hsl(${hue} ${sat}% 96% / 0)`]]),w*.2);}
// Four bolts on a face. Nothing says "manufactured object" faster, and they cost eight ellipses.
function bolts(c,x0,y0,x1,y1,r,hue,sat){for(const[x,y]of [[x0,y0],[x1,y0],[x0,y1],[x1,y1]]){
 ao(c,x,y+r*.4,r*2,r*1.5,.45);
 oval(c,x,y,r,r,metal(c,x-r,x+r,hue,sat),`hsl(${hue} ${sat}% 84% / .5)`,.6);
 line(c,`M${x-r*.5} ${y-r*.15} L${x+r*.5} ${y-r*.15}`,`hsl(${hue} ${sat+10}% 12% / .8)`,.9);}}
function bottle(){
 const c=future.getContext('2d');c.scale(2,2);
 const H=96,S=15,GH=104,GS=32;  // shell metal, and the cultivation green
 // The same photographed cap/mouth and amber lower reservoir anchor the new vessel's lineage.
 c.save();c.beginPath();c.rect(0,0,728,90);c.clip();c.drawImage(source,0,0,728,485);c.restore();
 c.save();c.beginPath();c.rect(0,397,728,88);c.clip();c.drawImage(source,0,0,728,485);c.restore();
 // Rear plumbing: rooted at the neck manifold and original base, behind the chamber and pods.
 // The highlight fades along each riser's own run.
 pipe(c,'M347 87 C318 118 259 118 254 177 L254 320 Q254 380 323 408',10,H,S,347,87,254,408);
 pipe(c,'M382 87 C415 118 475 118 479 177 L479 320 Q479 380 407 408',10,H,S,382,87,479,408);
 // Both risers are bossed where they leave the surviving neck and where they re-enter the base.
 for(const[x,y,w,h]of [[347,90,26,11],[382,90,26,11],[326,405,24,10],[404,405,24,10]])boss(c,x,y,w,h,H,S);
 // A narrow transparent amber chamber leaves real open gaps where the disposable label used to be.
 const chamber=grad(c,327,0,404,0,[[0,'#365d5940'],[.12,'#d0e3b356'],[.36,'#658e6140'],[.68,'#b8d39838'],[1,'#233e3966']]);
 shape(c,'M329 125 Q364 111 400 125 L405 383 Q365 403 324 383 Z',chamber,'#8fae90',1.2);
 const tea=grad(c,330,287,407,390,[[0,'#b5a947aa'],[.4,'#b48628bd'],[1,'#704e1adc']]);
 shape(c,'M326 285 Q365 305 403 285 L405 382 Q365 401 325 383 Z',tea,'#b2a768',.8);
 oval(c,365,285,39,9,'#c8c776b0','#ddd89d',1);
 // Fresnel: glass goes bright at grazing angles, which is what separates a glass wall from a
 // tinted rectangle. Two narrow bands hugging the silhouette, brightest on the key side.
 shape(c,'M329 125 L324 383',null,axisA(c,120,390,true,[[0,.7],[.45,.25],[1,.5]],GH,18,94),2.4);
 shape(c,'M400 125 L405 383',null,axisA(c,120,390,true,[[0,.45],[.5,.12],[1,.3]],GH,18,90),1.6);
 line(c,'M335 143 L332 366','#c9dfbb70',1.6);
 // Cultivation membranes and a capillary stem are inside the chamber, never outside its skin.
 line(c,'M365 378 C358 315 375 257 362 184','#b1cf73',2);
 for(let i=0;i<7;i++){const y=205+i*21,dir=i%2?1:-1,d=`M365 ${y+12} Q${365+dir*29} ${y+5} ${365+dir*23} ${y-10} Q366 ${y-7} 365 ${y+12}`;
  shape(c,d,recess(c,365,365+dir*29,GH,GS,false,i%2?1.12:.95),null);
  // Each leaf gets a lit upper edge and a shaded underside, so they stack instead of overlapping.
  shape(c,`M365 ${y+11} Q${365+dir*27} ${y+4} ${365+dir*22} ${y-9}`,null,`hsl(${GH} ${GS}% 78% / .55)`,.8);
  shape(c,`M366 ${y-6} Q${365+dir*20} ${y-4} ${365+dir*22} ${y-9}`,null,`hsl(${GH} ${GS+8}% 14% / .5)`,1);}
 // Two non-identical pods are mechanically and hydraulically seated on the rear branches.
 for(const p of [{x:235,y:190,w:44,h:131},{x:459,y:168,w:51,h:162}]){
  const{x,y,w,h}=p,xm=x+w/2,x1=x+w;
  // Stem in the pod's own metal, then the boss that seats it: a pipe that simply stops at a wall
  // is the joint that made the whole assembly read as stacked shapes.
  pipe(c,`M${xm} ${y-14} L${xm} ${y+18}`,9,H,S,xm,y-14,xm,y+18);
  const pod=rr(x,y,w,h,18);
  c.save();c.shadowColor='#0008';c.shadowBlur=9;c.shadowOffsetY=6;
  shape(c,pod,metal(c,x,x1,H,S),`hsl(${H} ${S}% 80% / .55)`,.9);c.restore();
  // Moulded end caps. A rounded rectangle has no ends; a manufactured housing does, and the two
  // seams are where the eye reads wall thickness.
  for(const[yy,hh]of [[y+3,15],[y+h-18,15]]){
   shape(c,rr(x+2.5,yy,w-5,hh,7),metal(c,x+2.5,x1-2.5,H,S,false,1.1),null);
   shape(c,`M${x+4} ${yy+hh} L${x1-4} ${yy+hh}`,null,`hsl(${H} ${S+6}% 13% / .55)`,1.1);}
  boss(c,xm,y+9,w*.46,11,H,S);
  bolts(c,x+9,y+11,x1-9,y+h-10,2.6,H,S);

// Seed-relative RGB tolerance avoids gradual colour drift into neighbouring material.
function eraseRegion(pixels,x,y,tolerance=32){
 const {width:w,height:h,data:d}=pixels;x=Math.floor(x);y=Math.floor(y);
 if(!Number.isFinite(x)||!Number.isFinite(y)||x<0||y<0||x>=w||y>=h)return 0;
 const seed=y*w+x,j=seed*4;if(!d[j+3])return 0;
 const r=d[j],green=d[j+1],b=d[j+2],queue=new Int32Array(w*h);let head=0,tail=0;
 const visit=i=>{const k=i*4;if(!d[k+3]||Math.max(Math.abs(d[k]-r),Math.abs(d[k+1]-green),Math.abs(d[k+2]-b))>tolerance)return;
  d[k+3]=0;queue[tail++]=i;};
 visit(seed);
 while(head<tail){const i=queue[head++];if(i%w)visit(i-1);if(i%w<w-1)visit(i+1);if(i>=w)visit(i-w);if(i<w*(h-1))visit(i+w);}
 return tail;
}

 async function load(url,name){
  const id=++request;clear();message('読み込み中…');const img=new Image();
  try{
   img.src=url;await img.decode();if(id!==request)return;
   if(img.naturalWidth<200||img.naturalHeight<200)throw Error('解像度が低すぎます（各辺 200px 以上）');
   if(img.naturalWidth*img.naturalHeight>40e6)throw Error('画素数が多すぎます（上限 4000 万）');
   // ponytail: bounded synchronous flood-fill at 1200px; use a worker if full-resolution editing becomes necessary.
   const scale=Math.min(1,1200/Math.max(img.naturalWidth,img.naturalHeight));
   const work=document.createElement('canvas');work.width=Math.max(1,Math.round(img.naturalWidth*scale));work.height=Math.max(1,Math.round(img.naturalHeight*scale));
   work.getContext('2d').drawImage(img,0,0,work.width,work.height);
   const decoded=new Image();decoded.src=work.toDataURL();await decoded.decode();if(id!==request)return;
   settings={tolerance:32,trimShadow:false,clearEnclosed:false};syncSettings();
   const rgba=work.getContext('2d').getImageData(0,0,work.width,work.height).data;let hasAlpha=false,kept=0;

async function labTest(){

 const old=segment(img),filled=segment(img,true),open=segment(img,false);

 const rows=[['default retains existing fill',old.kept===filled.kept&&alpha(old,100,80)===255],['open concavity remains transparent without fill',alpha(open,100,80)===0],['object remains solid',alpha(open,50,80)===255&&alpha(open,100,160)===255],['outer background is transparent',alpha(open,10,10)===0],['bounds unchanged by fill toggle',old.top===open.top&&old.base===open.base&&old.width===open.width]];
 g.fillStyle='white';g.fillRect(0,0,200,200);g.strokeStyle='red';g.lineWidth=10;g.strokeRect(40,40,120,120);
 const pixels=g.getImageData(0,0,200,200),n=eraseRegion(pixels,100,100);
 rows.push(['erase enclosed region without crossing coloured wall',n>0&&pixels.data[(100*200+100)*4+3]===0&&pixels.data[(40*200+40)*4+3]===255&&pixels.data[3]===255],['transparent seed makes no change',eraseRegion(pixels,100,100)===0],['out-of-bounds seed makes no change',eraseRegion(pixels,-1,100)===0]);
 const ring=new Image();ring.src=c.toDataURL();await ring.decode();
 const conservative=segment(ring,false,{trimShadow:false}),keyed=segment(ring,false,{trimShadow:false,clearEnclosed:true});
 rows.push(['enclosed removal is opt-in',alpha(conservative,100,100)===255&&alpha(keyed,100,100)===0&&alpha(keyed,40,100)===255]);
 g.clearRect(0,0,200,200);g.fillStyle='white';g.fillRect(40,40,120,120);g.clearRect(80,80,40,40);
 const transparent=new Image();transparent.src=c.toDataURL();await transparent.decode();
 const preserved=segment(transparent);
 rows.push(['input alpha and enclosed transparent holes survive',!!preserved&&alpha(preserved,100,100)===0&&alpha(preserved,50,50)===255&&Math.abs(preserved.kept-.32)<.0001]);
 g.fillStyle='white';g.fillRect(0,0,200,200);g.fillStyle='red';g.fillRect(80,20,40,150);g.fillRect(40,145,120,30);
 const foot=new Image();foot.src=c.toDataURL();await foot.decode();
 rows.push(['generic mode preserves a wide foot instead of trimming it as shadow',alpha(segment(foot,false,{trimShadow:false}),50,160)===255&&alpha(segment(foot,false),50,160)===0]);
 const thin=document.createElement('canvas');thin.width=1;thin.height=20;const tg=thin.getContext('2d');tg.fillStyle='white';tg.fillRect(0,0,1,20);tg.fillStyle='red';tg.fillRect(0,8,1,4);

 rows.push(['one-pixel-wide analysis does not invent a foreground',segment(narrow,false,{trimShadow:false})===null]);
