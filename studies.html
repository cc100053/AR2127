function bottle(){
 const c=future.getContext('2d');c.scale(2,2);

 c.save();c.beginPath();c.rect(0,397,728,88);c.clip();c.drawImage(source,0,0,728,485);c.restore();

 // Cultivation membranes and a capillary stem are inside the chamber, never outside its skin.

 for(let i=0;i<7;i++){const y=205+i*21,dir=i%2?1:-1;shape(c,`M365 ${y+12} Q${365+dir*29} ${y+5} ${365+dir*23} ${y-10} Q366 ${y-7} 365 ${y+12}`,i%2?'#82a763bd':'#a8c177b0','#b5ce8e70',.6);}

 for(const p of [{x:235,y:190,w:44,h:131},{x:459,y:168,w:51,h:162}]){

  for(let j=0;j<7;j++){const yy=y+28+j*(h-55)/6;line(c,`M${x+13} ${yy} Q${x+w/2} ${yy+7} ${x+w-13} ${yy}`,'#344f42',2);}

 }

 for(const side of [-1,1]){

 }

function cuff(){
 const c=future.getContext('2d');c.scale(2,2);
 const cx=358,cy=229,rx=222,ry=115,a=.60,b=5.68;
 function band(y,outerX=rx,outerY=ry,innerX=rx-43,innerY=ry-35){const p=new Path2D();p.ellipse(cx,y,outerX,outerY,0,a,b);p.ellipse(cx,y,innerX,innerY,0,b,a,true);p.closePath();return p;}
 const pearl=grad(c,140,100,540,350,[[0,'#8ca89e'],[.3,'#e2eada'],[.6,'#a7beb2'],[1,'#416963']]);
 const jade=grad(c,140,230,560,350,[[0,'#2d6859'],[.35,'#b9dbc5b0'],[.65,'#5baf8dc7'],[1,'#285952']]);
 // Curved solid cuff, open at the right. The empty center is actual alpha, not a painted dark oval.
 shape(c,band(cy+27),'#203f3e','#4e7367',1);
 const wall=new Path2D();wall.ellipse(cx,cy,rx,ry,0,a,b);wall.lineTo(cx+Math.cos(b)*rx,cy+27+Math.sin(b)*ry);wall.ellipse(cx,cy+27,rx,ry,0,b,a,true);wall.closePath();
 shape(c,wall,grad(c,150,190,550,330,[[0,'#496f62'],[.45,'#b6cec0'],[1,'#214740']]),'#739585',1);
 shape(c,band(cy),pearl,'#d5e7db',1);
 const inner=new Path2D();inner.ellipse(cx,cy,rx-43,ry-35,0,a,b);inner.lineTo(cx+Math.cos(b)*(rx-43),cy+27+Math.sin(b)*(ry-35));inner.ellipse(cx,cy+27,rx-43,ry-35,0,b,a,true);inner.closePath();
 shape(c,inner,'#294a46','#6d9586',.8);
 // A jade translucent secondary band is nested in and fastened to the same ceramic structure.
 shape(c,band(cy+8,rx+5,ry+4,rx-10,ry-8),jade,'#a8dcc0',.8);
 const seam=new Path2D();seam.ellipse(cx,cy+9,rx-4,ry-3,0,.69,5.59);line(c,seam,'#9ce2bd',1.3,3);
 for(const t of [.95,1.3,1.65,2.2,2.75,3.4,4.05,4.65,5.2]){const x=cx+Math.cos(t)*(rx-20),y=cy+Math.sin(t)*(ry-18);c.save();c.translate(x,y);c.rotate(Math.atan2((ry-18)*Math.cos(t),-(rx-20)*Math.sin(t)));shape(c,'M-8 -3 L8 -3 L8 3 L-8 3Z','#315951','#91b99e',.7);c.restore();}
 // Right terminal rests on the cuff cut-end; its nested antenna is housed in a compact ceramic block.
 const ex=cx+Math.cos(a)*rx,ey=cy+Math.sin(a)*ry;
 shape(c,`M${ex-20} ${ey-12} L${ex+22} ${ey-14} L${ex+29} ${ey+13} L${ex-11} ${ey+24}Z`,'#162f35','#607f79',1);
 shape(c,`M${ex-22} ${ey-20} L${ex+20} ${ey-22} L${ex+27} ${ey+5} L${ex-13} ${ey+16}Z`,pearl,'#d3e9d6',1);

 // The credential face is a small physical part of the front band: actual penguin + green card crop.
 c.save();c.translate(312,300);c.transform(1,.13,-.20,.82,0,0);

 c.restore();line(c,'M-76 96 L-64 104 L59 104 L71 94','#99daa7',1.2,2);
 shape(c,'M-83 -4 L-68 -4 L-68 83 L-83 83Z','#3c7956','#94bc87',.6);
 for(let i=0;i<5;i++)line(c,`M-80 ${i*14+8} L-73 ${i*14+8}`,'#b7d89a',1.2);

}
function build(){
 const c=source.getContext('2d');c.scale(2,2);
 if(kind==='bottle'){
  // Border-connected near-white removal preserves the enclosed original cap and amber liquid.
  const m=document.createElement('canvas');m.width=m.height=1280;const x=m.getContext('2d');x.drawImage(photo,0,0);const img=x.getImageData(0,0,1280,1280),d=img.data,q=new Int32Array(1280*1280),seen=new Uint8Array(q.length);let head=0,tail=0;
  function push(i){if(i<0||i>=seen.length||seen[i])return;seen[i]=1;const j=i*4;if(Math.min(d[j],d[j+1],d[j+2])<233)return;d[j+3]=0;q[tail++]=i;}
  for(let i=0;i<1280;i++){push(i);push(1279*1280+i);push(i*1280);push(i*1280+1279);}while(head<tail){const i=q[head++];if(i%1280)push(i-1);if(i%1280<1279)push(i+1);push(i-1280);push(i+1280);}x.putImageData(img,0,0);c.drawImage(m,150.6,22,428.8,428.8);bottle();
 }else{
  c.save();const clip=new Path2D();clip.roundRect(83,85,562,352,19);c.clip(clip);c.drawImage(photo,155,190,938,588,83,85,562,352);c.restore();cuff();
 }
}
let raf=0;
function draw(mix=1){ctx.setTransform(2,0,0,2,0,0);ctx.clearRect(0,0,728,485);ctx.save();ctx.shadowColor='#0009';ctx.shadowBlur=15;ctx.shadowOffsetY=14;ctx.globalAlpha=1-mix;ctx.drawImage(source,0,0,728,485);ctx.globalAlpha=mix;ctx.drawImage(future,0,0,728,485);ctx.restore();}
function evolve(){cancelAnimationFrame(raf);slider.value=100;phase.textContent='形態重組中';const start=performance.now();function tick(now){const p=Math.min(1,(now-start)/1800);draw(p*p*(3-2*p));if(p<1)raf=requestAnimationFrame(tick);else{raf=0;phase.textContent='2127 / 形態完成';}}if(matchMedia('(prefers-reduced-motion: reduce)').matches){draw();phase.textContent='2127 / 形態完成';}else raf=requestAnimationFrame(tick);}
slider.addEventListener('input',()=>{cancelAnimationFrame(raf);raf=0;draw(+slider.value/100);phase.textContent=+slider.value===0?'原始物件':+slider.value===100?'2127 / 形態完成':'原型 ↔ 未來形態';});replay.addEventListener('click',evolve);
function selfTest(){const rows=[],check=(n,ok)=>rows.push(`${ok?'PASS':'FAIL'} ${n}`),a=source.getContext('2d').getImageData(0,0,1456,970).data,b=future.getContext('2d').getImageData(0,0,1456,970).data;let count=0,removed=0,added=0;for(let i=3;i<a.length;i+=4){if(a[i]>200){count++;if(b[i]<30)removed++;}else if(a[i]<10&&b[i]>180)added++;}
 check('calibrated source dimensions',photo.naturalWidth===1280&&photo.naturalHeight===(kind==='bottle'?1280:961));check('source background is transparent',a[3]===0&&count>1000);check('original solid area physically removed',removed/count>(kind==='bottle'?.12:.3));if(kind==='bottle')check('connected pods extend beyond source',added/count>.05);else{const alpha=(x,y)=>b[(y*2*1456+x*2)*4+3];check('open cuff has solid band and credential mount, clear side gap',alpha(358,125)>200&&alpha(312,330)>200&&alpha(581,229)===0);}
 const hole=kind==='bottle'?[309,280]:[365,228],k=(hole[1]*2*1456+hole[0]*2)*4+3;check('former body contains actual transparent negative space',a[k]>200&&b[k]===0);draw();check('final composite removes old body',ctx.getImageData(0,0,1456,970).data[k]<30);check('controls enabled',!slider.disabled&&!replay.disabled);
 const out=document.getElementById('checks');out.hidden=false;out.textContent=rows.join('\n');return{rows,removed:removed/count,added:added/count};}
photo.onload=()=>{const expectedHeight=kind==='bottle'?1280:961;if(photo.naturalWidth!==1280||photo.naturalHeight!==expectedHeight){phase.textContent='圖片尺寸與校準不符';return;}build();slider.disabled=replay.disabled=false;evolve();if(Q.has('test'))selfTest();};photo.onerror=()=>{phase.textContent='圖片載入失敗，請用本地預覽網址開啟';phase.classList.add('error');};photo.src=`assets/${kind}-source.${kind==='bottle'?'webp':'jpg'}`;
