// Busy, cropped-through or reflective backgrounds are out of scope and fail the sanity gate below.
function segment(img){
 const w=img.naturalWidth,h=img.naturalHeight,m=document.createElement('canvas');

 const med=a=>{a.sort((p,q)=>p-q);return(a[2]+a[3])/2;};
 const edge=(y,x0)=>{const r=[],g=[],b=[];for(let i=0;i<6;i++){const j=(y*w+x0+i)*4;r.push(d[j]);g.push(d[j+1]);b.push(d[j+2]);}return[med(r),med(g),med(b)];};
 const ok=new Uint8Array(N);
 for(let y=0;y<h;y++){const L=edge(y,0),R=edge(y,w-6);
  for(let px=0;px<w;px++){const t=px/(w-1),j=(y*w+px)*4;
   ok[y*w+px]=Math.max(Math.abs(d[j]-(L[0]*(1-t)+R[0]*t)),Math.abs(d[j+1]-(L[1]*(1-t)+R[1]*t)),Math.abs(d[j+2]-(L[2]*(1-t)+R[2]*t)))<=tol?1:0;}}
 const q=new Int32Array(N),seen=new Uint8Array(N),cleared=new Uint8Array(N);let head=0,tail=0;
 const push=i=>{if(i<0||i>=N||seen[i])return;seen[i]=1;if(!ok[i])return;cleared[i]=1;q[tail++]=i;};
 for(let i=0;i<w;i++){push(i);push((h-1)*w+i);}
 for(let y=0;y<h;y++){push(y*w);push(y*w+w-1);}
 while(head<tail){const i=q[head++];if(i%w)push(i-1);if(i%w<w-1)push(i+1);push(i-w);push(i+w);}
 // An upright bottle is horizontally convex at every height, so refilling each row's span closes
 // any low-contrast leak (here: the bottle's own reflection) that ate a channel up its middle.
 const wid=new Int32Array(h),ends=new Int32Array(h*2);
 for(let y=0;y<h;y++){let a=-1,b=-1;
  for(let px=0;px<w;px++)if(!cleared[y*w+px]){if(a<0)a=px;b=px;}
  if(a<0)continue;for(let px=a;px<=b;px++)cleared[y*w+px]=0;
  wid[y]=b-a+1;ends[y*2]=a;ends[y*2+1]=b;}

 nz.sort((a,b)=>a-b);const body=nz[nz.length>>1];

 // row in the lower part that flares back out is where the object ends and its shadow begins.

 for(let y=top;y<=base;y++)if(wid[y]){cs.push((ends[y*2]+ends[y*2+1])/2);if(wid[y]>width)width=wid[y];}
 cs.sort((a,b)=>a-b);
 let keptN=0;for(let i=0;i<N;i++){if(cleared[i])d[i*4+3]=0;else keptN++;}
 // A correctly segmented single object never spans to both side borders; an unsegmented frame does.
 let onL=false,onR=false;
 for(let y=0;y<h;y++){if(!cleared[y*w])onL=true;if(!cleared[y*w+w-1])onR=true;}
 x.putImageData(id,0,0);
 return{canvas:m,top,base,cx:cs[cs.length>>1],width,kept:keptN/N,bothSides:onL&&onR};
}

// Photo B is a vacuum steel flask: it has already solved the disposable bottle's problem, so it

function flask(elev){

 c.save();c.beginPath();c.rect(0,404,728,81);c.clip();c.drawImage(source,0,0,728,485);c.restore();

 stube('M347 126 L324 130 Q286 156 282 204 L282 330 Q284 374 332 397',9);
 oval(c,349,126,7,RY(7,5),'#26333b','#cfe3ea',1.1);

 shape(c,'M344 286 Q365 296 386 286 L387 384 Q365 396 343 384 Z',water,'#93e0ef',.8);

function build(){
 // Re-runnable: a second load must not inherit the first one's transform or pixels.
 // build() used to run exactly once, so the scale(2,2) below would compound silently (gotcha #9).
 const c=source.getContext('2d');
 c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,1456,970);c.scale(2,2);
 if(family==='bottle'){
  const s=segment(photo);if(!s)return false;
  // Reject anything that is not one upright bottle-shaped silhouette rather than rendering nonsense.
  // The shape tests alone are geometric and cannot tell a good mask from none at all: a cluttered
  // background survives segmentation whole and can still land inside them. Area alone is no better —
  // it conflates "background not removed" with "object simply framed tight", which would reject a
  // correctly segmented photo. Reaching both side borders is the signal that the frame, not an
  // object, is what survived; the loose area bound catches a mask that hugs one edge only.
  const asp=s.width/(s.base-s.top);
  if(!(s.base-s.top>photo.naturalHeight*.25&&asp>.15&&asp<.6&&!s.bothSides&&s.kept<.6))return false;
  // bottle()'s geometry is drawn for a bottle whose top/base/centre sit at 22.3/450.5/364.8.
  // Placing any measured bottle onto those anchors reuses that artwork without re-authoring it.
  const k=428.2/(s.base-s.top);
  c.drawImage(s.canvas,364.8-s.cx*k,22.3-s.top*k,s.canvas.width*k,s.canvas.height*k);
  anchors=s;renderFuture();
 }else{
  c.save();const clip=new Path2D();clip.roundRect(83,85,562,352,19);c.clip(clip);c.drawImage(photo,155,190,938,588,83,85,562,352);c.restore();renderFuture();
 }
 return true;
}
let raf=0;
function draw(mix=1){ctx.setTransform(2,0,0,2,0,0);ctx.clearRect(0,0,728,485);ctx.save();ctx.shadowColor='#0009';ctx.shadowBlur=15;ctx.shadowOffsetY=14;ctx.globalAlpha=1-mix;ctx.drawImage(source,0,0,728,485);ctx.globalAlpha=mix;ctx.drawImage(future,0,0,728,485);ctx.restore();}
function evolve(){cancelAnimationFrame(raf);slider.value=100;phase.textContent='形態重組中';const start=performance.now();function tick(now){const p=Math.min(1,(now-start)/1800);draw(p*p*(3-2*p));if(p<1)raf=requestAnimationFrame(tick);else{raf=0;phase.textContent='2127 / 形態完成';}}if(matchMedia('(prefers-reduced-motion: reduce)').matches){draw();phase.textContent='2127 / 形態完成';}else raf=requestAnimationFrame(tick);}
if(kind==='bottle-b'){const wrap=document.getElementById('elevwrap'),el=document.getElementById('elevation');
 wrap.hidden=false;
 el.addEventListener('input',()=>{cancelAnimationFrame(raf);raf=0;
  const e=E0+(E1-E0)*(+el.value/100);renderFuture(e);
  // The source photo cannot follow the camera, so the comparison is pinned to the future view.
  slider.value=100;draw(1);
  phase.textContent=+el.value?`鏡頭仰角 ${Math.round(e*180/Math.PI)}°（原型・近似）`:'2127 / 形態完成';});}
slider.addEventListener('input',()=>{cancelAnimationFrame(raf);raf=0;draw(+slider.value/100);phase.textContent=+slider.value===0?'原始物件':+slider.value===100?'2127 / 形態完成':'原型 ↔ 未來形態';});replay.addEventListener('click',evolve);
function selfTest(){const rows=[],check=(n,ok)=>rows.push(`${ok?'PASS':'FAIL'} ${n}`),a=source.getContext('2d').getImageData(0,0,1456,970).data,b=future.getContext('2d').getImageData(0,0,1456,970).data;let count=0,removed=0,added=0;for(let i=3;i<a.length;i+=4){if(a[i]>200){count++;if(b[i]<30)removed++;}else if(a[i]<10&&b[i]>180)added++;}
 if(family==='bottle'){check('background actually removed, not merely plausible geometry',!!anchors&&!anchors.bothSides&&anchors.kept<.6);
  check('anchors measured from this photo, not hardcoded',!!anchors&&anchors.base-anchors.top>photo.naturalHeight*.25&&Math.abs(anchors.cx-photo.naturalWidth/2)<photo.naturalWidth*.2);
  if(kind==='bottle'){const k=428.2/(anchors.base-anchors.top);
   check('calibrated fixture still lands on its authored placement',Math.abs(364.8-anchors.cx*k-150.6)<3&&Math.abs(photo.naturalWidth*k-428.8)<6);}}
 else check('calibrated source dimensions',photo.naturalWidth===1280&&photo.naturalHeight===961);check('source background is transparent',a[3]===0&&count>1000);check('original solid area physically removed',removed/count>(family==='bottle'?.12:.3));if(family==='bottle')check('new structures extend beyond source',added/count>.05);else{const alpha=(x,y)=>b[(y*2*1456+x*2)*4+3];check('open cuff has solid band and credential mount, clear side gap',alpha(358,125)>200&&alpha(312,330)>200&&alpha(581,229)===0);}
 const hole=kind==='bottle-b'?[314,160]:family==='bottle'?[309,280]:[365,228],k=(hole[1]*2*1456+hole[0]*2)*4+3;check('former body contains actual transparent negative space',a[k]>200&&b[k]===0);draw();check('final composite removes old body',ctx.getImageData(0,0,1456,970).data[k]<30);check('controls enabled',!slider.disabled&&!replay.disabled);
 if(family==='bottle'){

  // Idempotence is the property that matters: every renderer calls scale(2,2), so a missing
  // transform reset would compound silently and only surface as a slowly shrinking object

  // depend on whatever ran before — which is how the earlier version of this check came to fail.
  // Returning to elevation 0 after a tilt must land back on the authored drawing: a leaked clip or

const UNSUPPORTED='此相片不在支援範圍：需要單一直立物件、乾淨漸層背景、完整入鏡';
function fail(msg){
 for(const g of [source.getContext('2d'),future.getContext('2d'),ctx]){
  g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,1456,970);}
 cancelAnimationFrame(raf);raf=0;anchors=null;

 phase.textContent=msg;phase.classList.add('error');

function show(){
 phase.classList.remove('error');
 slider.disabled=replay.disabled=false;evolve();

function loadFile(file){
 if(!file)return;
 if(!/^image\/(jpeg|png|webp)$/.test(file.type))return fail('只支援 JPEG / PNG / WebP');
 if(file.size>20*1024*1024)return fail('檔案過大（上限 20MB）');
 const url=URL.createObjectURL(file),img=new Image();
 img.onload=()=>{
  URL.revokeObjectURL(url);            // release before any early return below
  if(img.naturalWidth<200||img.naturalHeight<200)return fail('解像度太低（每邊至少 200px）');
  if(img.naturalWidth*img.naturalHeight>40e6)return fail('像素太多（上限 4000 萬）');
  photo=img;
  const t=performance.now();
  if(!build())return fail(UNSUPPORTED);
  document.getElementById('loadhint').textContent=
   `已載入 ${img.naturalWidth}×${img.naturalHeight}・分割 ${Math.round(performance.now()-t)}ms`;
  show();
 };
 img.onerror=()=>{URL.revokeObjectURL(url);fail('圖片解碼失敗');};
 img.src=url;
}
