:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#edf5f5;background:#080c10}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 55% 45%,#15262c 0,transparent 60%)}main{max-width:1240px;margin:auto;padding:32px 48px}header,footer,.controls,.labels{display:flex;align-items:center;justify-content:space-between;gap:24px}header{border-bottom:1px solid #263238;padding-bottom:20px}a{color:#a6babf;text-decoration:none;font-size:12px}a:hover{color:#7bf6e4}.mark{font-size:20px;letter-spacing:-1px}.mark span{color:#70858d;font-size:11px;letter-spacing:2px;margin-left:14px}.hero{display:grid;grid-template-columns:260px minmax(0,1fr);align-items:center;gap:24px;min-height:570px}.eyebrow{font:10px ui-monospace,monospace;letter-spacing:3px;color:#6fd9d3}h1{font-size:42px;font-weight:450;line-height:1.25;letter-spacing:-2px;margin:24px 0 18px}.intro{font-size:14px;color:#8da1a8;line-height:1.9;max-width:245px}.specs{margin-top:42px;display:grid;gap:16px;font-size:11px;color:#b9c9cd}.specs span{color:#5f757e;margin-right:15px;font:10px ui-monospace,monospace}figure{margin:0;min-width:0}canvas{display:block;width:100%;height:auto}figcaption{font:10px ui-monospace,monospace;letter-spacing:2px;color:#63808a;text-align:center}.controls{max-width:650px;margin:0 auto 48px}.compare{flex:1}.labels{font-size:11px;color:#9eafb5;gap:10px}input{width:100%;accent-color:#77e5d7;margin:14px 0 0;cursor:ew-resize}button{background:#132729;border:1px solid #36565b;color:#b7f5e8;padding:13px 19px;border-radius:4px;font-size:12px;cursor:pointer;white-space:nowrap}button:hover{background:#1e3b3c}button:disabled{opacity:.45;cursor:wait}:focus-visible{outline:2px solid #a6fff0;outline-offset:5px}footer{border-top:1px solid #263238;padding-top:22px;font-size:11px;color:#617981}footer p{margin:0;line-height:1.8}.kept{color:#a4babe;font-size:13px}.error{color:#ffaaaa}#checks{white-space:pre-wrap;font:12px/1.8 ui-monospace,monospace;color:#8af0bb} @media(max-width:800px){main{padding:22px}.hero{grid-template-columns:1fr;gap:0;min-height:0}.copy{padding-top:35px}h1{font-size:32px;margin:15px 0}.intro{max-width:none}.specs{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}.hero figure{margin:10px -20px 30px}.controls{gap:15px;margin-bottom:32px}footer{align-items:flex-start;flex-direction:column;gap:15px}.mark span{display:none}}

<body><main>
<header><div class="mark">2127<span>100 YEARS LATER</span></div><nav aria-label="モノのテスト" style="display:flex;gap:20px;flex-wrap:wrap"><a href="studies.html?object=bottle">お茶ボトル</a><a href="studies.html?object=suica">IC カード</a><a href="studies.html?lab=1">分離ラボ</a><a href="index.html">回転動画 ↗</a></nav></header>
<section class="hero"><div class="copy"><div class="eyebrow">FORM STUDY / 002</div><h1>手のなかの窓、<br>次の世紀へ。</h1><p class="intro">画面は退場し、筐体がひらく。三枚のセラミック製センシングウィングが光導スパインにつながり、手になじむグリップだけが残る。</p><div class="specs"><div><span>01</span>展開するセンシングウィング</div><div><span>02</span>露出した光導スパイン</div><div><span>03</span>手のひらのグリップを継承</div></div></div>
<figure><canvas id="view" width="1456" height="970" role="img" aria-label="画面と上半分の筐体が消え、三枚のセラミック製センシングウィングをつなぐ光導スパインへ。下端は元のグリップとボタンを残す"></canvas><figcaption id="phase" aria-live="polite">形態推定の準備中</figcaption></figure></section>
<div class="controls"><div class="compare"><div class="labels"><label for="evolution">現在のスマホ</label><span>2127 形態</span></div><input id="evolution" aria-label="現在のスマホと 2127 形態の比較" type="range" min="0" max="100" value="100" disabled></div><button id="replay" disabled>推定をやり直す ↗</button></div>
<footer><p class="kept">百年後も、世界は手のなかにある。</p><p>静止画・ローカル生成<br>1 枚の写真によるキャリブレーション試験。回転追跡は含みません。</p></footer><pre id="checks" hidden></pre>
</main><script src="segmentation.js"></script><script src="calibration.js"></script><script>
'use strict';
const canvas=document.getElementById('view'), ctx=canvas.getContext('2d');
const slider=document.getElementById('evolution'), replay=document.getElementById('replay'), phase=document.getElementById('phase');
let photo=new Image();const original=document.createElement('canvas'), future=document.createElement('canvas');
original.width=future.width=1456;original.height=future.height=970;
// ponytail: screen cutout and planar corners calibrated only for this 728×485 photo.
// Add corner selection / segmentation when testing other objects; this is not automatic reconstruction.
// Projective map: unit rectangle → photographed plane. All seams and panel details use this map.
const corners=[[421,65],[662,108],[329,408],[61,329]], at=project(corners);
function path(points,closed=true){const p=new Path2D();points.forEach(([u,v,z=0],i)=>{const q=at(u,v);q[1]-=z;i?p.lineTo(...q):p.moveTo(...q);});if(closed)p.closePath();return p;}
function polygon(c,points,fill,stroke,width=.7){const p=path(points);if(fill){c.fillStyle=fill;c.fill(p);}if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.stroke(p);}}
function trace(c,points,color,width=1,glow=0){c.save();c.strokeStyle=color;c.lineWidth=width;c.shadowColor=color;c.shadowBlur=glow;c.stroke(path(points,false));c.restore();}
function makeFuture(){
 const c=future.getContext('2d');c.setTransform(2,0,0,2,0,0);c.clearRect(0,0,728,485);
 const pearl=c.createLinearGradient(170,100,540,350);pearl.addColorStop(0,'#f0f3e8');pearl.addColorStop(.4,'#a9c2c1');pearl.addColorStop(.62,'#e9eddf');pearl.addColorStop(1,'#768d96');
 const graphite=c.createLinearGradient(220,330,540,80);graphite.addColorStop(0,'#15232c');graphite.addColorStop(.5,'#4d666e');graphite.addColorStop(1,'#0c1820');
 // The photographed lower grip is the only original body retained: the screen is physically gone.
 c.save();c.clip(path([[-.1,.83],[1.1,.83],[1.1,1.1],[-.1,1.1]]));c.filter='grayscale(1)';c.drawImage(original,0,0,728,485);c.filter='none';
 c.fillStyle='#1d3039';c.fill(new Path2D('M424 88 L626 128 L329 376 L100 306Z'));c.restore();
 // The last strip of the old display becomes a solid docking plate, not a wallpaper remnant.
 polygon(c,[[.035,.828],[.955,.828],[.91,.901],[.09,.901]],'#1d3039','#6e9298',.8);
 function solid(points,fill=pearl,depth=6){
  polygon(c,points.map(([u,v,z=0])=>[u,v,z-depth]),'#1a2e37','#40545c',.7);
  for(let i=0;i<points.length;i++){const a=points[i],b=points[(i+1)%points.length];polygon(c,[a,b,[b[0],b[1],(b[2]||0)-depth],[a[0],a[1],(a[2]||0)-depth]],i%2?'#52707a':'#223943','#41565f',.45);}
  polygon(c,points,fill,'#d9ebe5',.75);
 }
 // A horseshoe docking collar grows from the old home-button end.
 solid([[.025,.84,0],[.18,.795,4],[.36,.795,6],[.36,.845,6],[.18,.865,2],[.06,.93,0]],graphite);
 solid([[.64,.795,6],[.84,.795,4],[.975,.84,0],[.93,.93,0],[.8,.865,2],[.64,.845,6]],graphite);
 trace(c,[[.08,.88,2],[.2,.824,5],[.35,.824,7]],'#8be4d8',1.3,3);
 trace(c,[[.67,.824,7],[.83,.824,5],[.93,.88,2]],'#8be4d8',1.3,3);
 // Three connected, asymmetric hinged petals. Heights are artist-calibrated 2.5D, not reconstructed depth.
 const petals=[
  {hinge:[.43,.30,11],outline:[[.43,.26,11],[.17,.12,28],[-.43,.08,40],[-.29,.31,32],[.12,.39,20],[.43,.35,11]],inset:[[.23,.27,20],[.02,.18,29],[-.30,.135,37],[-.18,.267,30],[.10,.326,22]]},
  {hinge:[.57,.48,13],outline:[[.57,.43,13],[.96,.27,30],[1.47,.30,38],[1.22,.53,31],[.86,.59,23],[.57,.53,13]],inset:[[.75,.46,20],[1.01,.34,30],[1.33,.345,36],[1.14,.47,29],[.88,.525,23]]},
  {hinge:[.43,.66,10],outline:[[.43,.61,10],[.04,.47,26],[-.39,.48,31],[-.26,.68,26],[.10,.75,18],[.43,.71,10]],inset:[[.22,.641,17],[-.005,.545,26],[-.26,.537,29],[-.17,.624,24],[.08,.683,20]]}
 ];
 for(const p of petals){
  c.save();c.shadowColor='#0008';c.shadowBlur=8;c.shadowOffsetY=6;solid(p.outline);c.restore();
  polygon(c,p.inset,'#18303b','#6f999f',1);
  const a=p.inset[0],b=p.inset[2],mid=p.inset[1];
  trace(c,[a,mid,b],'#92e5db',1.2,3);
  // Recessed conductive ribs follow each petal's actual plane.
  for(let i=1;i<9;i++){const t=i/10;const q=a.map((n,j)=>n+(b[j]-n)*t);trace(c,[[q[0],q[1],q[2]+.2],[q[0]+.04,q[1]+.022,q[2]+.2]],'#7899a3',.8);}
  const [hu,v,z]=p.hinge,u=hu+(hu<.5?-.10:.10);
  solid([[u-.065,v-.024,z+2],[u+.065,v-.024,z+2],[u+.065,v+.024,z+2],[u-.065,v+.024,z+2]],'#162e39',4);
  trace(c,[[u-.04,v,z+3],[u+.04,v,z+3]],'#cafbf0',1.5,4);
  polygon(c,[[u-.022,v-.008,z+3],[u+.022,v-.008,z+3],[u+.022,v+.008,z+3],[u-.022,v+.008,z+3]],'#a3fff0');
 }
 // An exposed long core, with the petal roots occluded by its central load-bearing spine.
 solid([[.39,.86,5],[.37,.28,13],[.43,.02,22],[.55,-.01,24],[.63,.24,15],[.62,.86,5]],graphite,9);
 solid([[.425,.77,13],[.423,.25,22],[.48,.10,29],[.535,.10,29],[.579,.26,22],[.575,.77,13]],'#a7b8b8',4);
 polygon(c,[[.463,.765,14],[.46,.28,24],[.487,.17,30],[.521,.17,30],[.543,.28,24],[.537,.765,14]],'#102532','#537d8c',1);
 trace(c,[[.491,.75,15],[.489,.28,25],[.504,.20,31]],'#a7ffee',2.3,7);
 for(let i=0;i<18;i++){const v=.3+i*.023;trace(c,[[.425,v,22-(v-.3)*18],[.459,v,24-(v-.3)*18]],'#304b57',1.7);trace(c,[[.543,v,24-(v-.3)*18],[.577,v,22-(v-.3)*18]],'#526b73',1.1);}
 // A small forward sensor prism is physically seated in the tip; no floating display.
 solid([[.44,.035,27],[.445,-.075,29],[.53,-.11,32],[.585,-.035,31],[.56,.055,27]],pearl,6);
 polygon(c,[[.463,-.017,30],[.475,-.071,32],[.532,-.083,34],[.552,-.025,32],[.53,.008,30]],'#142c3b','#608797',1);
 trace(c,[[.48,-.045,33],[.536,-.045,33]],'#e6acd6',1.4,4);
 // Original physical home button remains legible in the retained grip.
 c.save();c.strokeStyle='#599c9a';c.lineWidth=.8;c.beginPath();c.ellipse(184,355,32,8.7,.24,0,Math.PI*2);c.stroke();c.restore();
}
let raf=0, started=0;
function draw(amount=1,progress=1){
 ctx.setTransform(2,0,0,2,0,0);ctx.clearRect(0,0,728,485);
 // Crossfade the whole source away, including its alpha: removed structure must reveal the background.
 const mix=amount*(progress*progress*(3-2*progress));
 ctx.save();ctx.translate(364,242);ctx.scale(.84,.84);ctx.translate(-364,-242);
 ctx.shadowColor='#0009';ctx.shadowBlur=18;ctx.shadowOffsetY=15;
 ctx.globalAlpha=1-mix;ctx.drawImage(original,0,0,728,485);
 ctx.globalAlpha=mix;ctx.drawImage(future,0,0,728,485);ctx.restore();
}
function evolve(){cancelAnimationFrame(raf);slider.value=100;started=performance.now();phase.textContent='筐体を展開中';
 const tick=now=>{const p=Math.min(1,(now-started)/1800);draw(1,p);if(p<1)raf=requestAnimationFrame(tick);else{raf=0;phase.textContent='2127 / 形態完成';}};
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){draw();phase.textContent='2127 / 形態完成';}else raf=requestAnimationFrame(tick);
}
slider.addEventListener('input',()=>{cancelAnimationFrame(raf);raf=0;draw(slider.value/100);phase.textContent=+slider.value===0?'現在のスマホ':+slider.value===100?'2127 / 形態完成':'現在 ↔ 2127 形態';});
replay.addEventListener('click',evolve);
function selfTest(){
 const rows=[],check=(name,ok)=>{rows.push(`${ok?'PASS':'FAIL'} ${name}`);};
 check('four projective corners match the photo',[[0,0],[1,0],[1,1],[0,1]].every(([u,v],i)=>Math.hypot(...at(u,v).map((n,j)=>n-corners[i][j]))<1e-6));
 check('sampled surface coordinates stay finite',Array.from({length:121},(_,i)=>at((i%11)/10,Math.floor(i/11)/10)).every(p=>p.every(Number.isFinite)));
 const a=original.getContext('2d').getImageData(0,0,1456,970).data,b=future.getContext('2d').getImageData(0,0,1456,970).data;
 check('photo loaded at calibrated dimensions',photo.naturalWidth===728&&photo.naturalHeight===485);
 check('background removed; white body retained',a[(10*1456+10)*4+3]===0&&a[(710*1456+368)*4+3]===255);
 check('future surface changes source pixels',a.some((n,i)=>i%4!==3&&Math.abs(n-b[i])>100));
 let sourceArea=0,removed=0,added=0;
 for(let i=3;i<a.length;i+=4){if(a[i]>200){sourceArea++;if(b[i]<10)removed++;}else if(a[i]<10&&b[i]>200)added++;}
 check('over 25% of original slab is physically removed',removed/sourceArea>.25);
 check('new solid structures extend beyond original silhouette',added/sourceArea>.12);
 const [hx,hy]=at(.8,.7),hole=(Math.round(hy*2)*1456+Math.round(hx*2))*4+3;
 check('former screen has true transparent negative space',a[hole]>200&&b[hole]===0);
 draw(1);const visibleHole=(Math.round((242+(hy-242)*.84)*2)*1456+Math.round((364+(hx-364)*.84)*2))*4+3;
 check('final composite does not retain removed screen',ctx.getImageData(0,0,1456,970).data[visibleHole]<15);
 const out=document.getElementById('checks');out.hidden=false;out.textContent=rows.join('\n');return rows;
}
function loadDefault(){photo=new Image();const current=photo;
photo.onload=()=>{if(photo!==current)return;if(photo.naturalWidth!==728||photo.naturalHeight!==485){phase.textContent='写真サイズがキャリブレーションと一致しません';return;}
 // Remove only near-white pixels connected to image borders: the white phone remains enclosed.
 const mask=document.createElement('canvas');mask.width=728;mask.height=485;
 const m=mask.getContext('2d');m.drawImage(photo,0,0);const pixels=m.getImageData(0,0,728,485),d=pixels.data;
 const queue=new Int32Array(728*485),seen=new Uint8Array(queue.length);let head=0,tail=0;
 function enqueue(i){if(i<0||i>=seen.length||seen[i])return;seen[i]=1;const j=i*4;
  if(Math.min(d[j],d[j+1],d[j+2])<220||Math.max(d[j],d[j+1],d[j+2])-Math.min(d[j],d[j+1],d[j+2])>18)return;
  queue[tail++]=i;d[j+3]=0;}
 for(let x=0;x<728;x++){enqueue(x);enqueue(484*728+x);}for(let y=0;y<485;y++){enqueue(y*728);enqueue(y*728+727);}
 while(head<tail){const i=queue[head++];if(i%728)enqueue(i-1);if(i%728<727)enqueue(i+1);enqueue(i-728);enqueue(i+728);}
 m.putImageData(pixels,0,0);const oc=original.getContext('2d');oc.clearRect(0,0,1456,970);oc.drawImage(mask,0,0,1456,970);
 makeFuture();phase.classList.remove('error');slider.disabled=replay.disabled=false;evolve();
 if(new URLSearchParams(location.search).has('test'))selfTest();};
photo.onerror=()=>{if(photo!==current)return;phase.textContent='写真の読み込みに失敗しました。ローカル HTTP サーバー経由で開いてください';phase.classList.add('error');};
photo.src='assets/phone-source.jpg';
}
loadDefault();
mountCalibration({parent:document.querySelector('main'),kind:'スマホ',target:corners,width:728,height:485,onRestore:loadDefault,onReady:(img,mask)=>{
 cancelAnimationFrame(raf);photo=img;const c=original.getContext('2d');c.clearRect(0,0,1456,970);c.drawImage(mask,0,0,1456,970);
 makeFuture();slider.disabled=replay.disabled=false;phase.classList.remove('error');document.getElementById('checks').hidden=true;evolve();
}});
</script></body></html>
